name: sidekick
description: 'Sidekick.'
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # Used for declarative routing
  go_router: ^14.0.0

  # Used for dependency injection
  get_it: ^8.0.2

  # Used for enhanced logging and debugging
  logger: ^2.4.0
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0

  # Used for playing Rive animations
  rive: ^0.15.0-dev.1

  # Used for device-local settings: the day's pairing, the onboarding answers.
  # Losing any of it costs the user nothing, which is why it is not on the
  # server.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

  assets:
    - assets/images/
