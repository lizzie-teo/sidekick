name: sidekick
description: 'Sidekick.'
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # Used for declarative routing
  go_router: ^14.0.0

  # Used for dependency injection
  get_it: ^8.0.2

  # Used for enhanced logging and debugging
  logger: ^2.4.0
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0

  # Used for playing Rive animations
  rive: ^0.15.0-dev.1

  # Used for the daily reminders. Local notifications only -- the phone holds
  # the alert itself, so there is no server, no push token and no cost, and it
  # works with no connection. `timezone` is what lets an alert be booked for
  # 8:30 pm in the user's own zone rather than drifting an hour at the
  # daylight-saving change; `flutter_timezone` is what asks the phone which
  # zone that is.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Used for device-local settings: the day's pairing, the onboarding answers.
  # Losing any of it costs the user nothing, which is why it is not on the
  # server.
  shared_preferences: ^2.3.0

  # Used for the recorded voice on the breathing screen. One player, one clip
  # at a time -- see PanicVoice for why a second player would be a bug rather
  # than a feature.
  just_audio: ^0.9.42

  # Used for "Send me a copy of everything" on the Me tab. The phone builds
  # the document and hands it to the operating system's own share sheet, where
  # Mail is one choice among several. No server and no email address are
  # involved, which is the point: almost every account is anonymous, so a
  # mailer on the server could only serve the few who have signed up.
  #
  # `pdf` draws it, `path_provider` finds the temporary directory it is
  # written into, and `share_plus` opens the sheet.
  pdf: ^3.13.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0

  # Used for short, one-off entrance effects -- a line fading in, a card
  # sliding up -- so a screen does not hand-roll an AnimationController for
  # three seconds of movement. It is a convenience over Flutter's own
  # animation, not a replacement for it.
  #
  # It is NOT for the character or the breathing pacer. Those are Rive, and
  # the pacer's one rule is that its timing comes from the Rive events and
  # nothing else. A second clock on that screen is the bug the rule exists
  # to stop.
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Lets a test wind a Timer forward instead of waiting out a real one. Used
  # by the breathing lead-in, which is four seconds of beats.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  # Poppins, SIL Open Font License 1.1 -- assets/fonts/OFL.txt. All nine
  # weights are bundled; SkText uses 400 to 700 and the rest are there for
  # decoration. Lexend was the face until 20 September 2026 and is gone, not
  # kept as a fallback: a second family that nothing names is dead weight in
  # the bundle and a trap for anyone who copies an old `fontFamily` string.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

        # The one italic, at 400 only. It is what `SkText.quote` is set in --
        # the example sentences on the practice drill's introduction pages.
        #
        # It is a real Poppins italic cut, not a slant. Flutter does not
        # synthesise one: `FontStyle.italic` on a family with no italic asset
        # renders upright and reports nothing, which is how a missing italic
        # goes unnoticed. Only 400 is here because only 400 is used; a bold
        # italic would be another 180KB nothing asks for.
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic

    # Shantell Sans, SIL Open Font License 1.1 --
    # assets/fonts/OFL-ShantellSans.txt. The app's second family, and the
    # face all quoted speech in a practice lesson is set in.
    #
    # **It replaced Edu SA Beginner on 25 September 2026, after that face was
    # reported as small, loose and hard to read** -- all three of which it
    # measurably was. The reasoning, the numbers behind it and the rule about
    # where this family may appear are on `SkText.quoted`; this note covers
    # only the file.
    #
    # **The file is subset and pinned, so it is not the one Google ships.**
    # The original is 1.25MB and carries four axes and every script under the
    # sun. What is here is Latin-1 plus curly quotes and dashes, with the
    # BNCE (bounce), INFM (informality) and SPAC (spacing) axes pinned at 0
    # and only `wght` left live, 300 to 800, defaulting to 400. Pinning the
    # quirk axes is a legibility decision as much as a size one: at their
    # defaults the face bounces off the baseline, which is charming in a
    # headline and tiring in a sentence somebody is being asked to judge.
    #
    # The OFL permits this -- the copyright line carries no Reserved Font
    # Name, so a modified copy may keep the name -- and requires the licence
    # to ship beside it, which is what the `.txt` above is for. Re-cut it with
    # `fontTools` if the coverage is ever short; do not swap in the upstream
    # file, or the axes come back at their defaults.
    #
    # **A weight needs `fontVariations` as well as `fontWeight`**, because
    # this is one variable file rather than a cut per weight.
    # `test/quote_font_test.dart` fails if either goes missing.
    - family: Shantell Sans
      fonts:
        - asset: assets/fonts/ShantellSans-Latin.ttf
          weight: 400

  assets:
    - assets/images/
    - assets/rive/
    - assets/audio/

  # Fragment shaders, compiled by the build and loaded through ShaderCache.
  # They are listed one by one rather than by folder: Flutter has no folder
  # form for shaders, and a missing line fails at runtime, not at build.
  shaders:
    - shaders/halo_soft.frag
    - shaders/halo_warm.frag
    - shaders/halo_mist.frag
    - shaders/blob_orb.frag
